services:
  postgres:
    image: postgres:16-alpine
    container_name: avtoslot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: avtoslot
      POSTGRES_USER: avtoslot
      POSTGRES_PASSWORD: avtoslot_password
    ports:
      - "5433:5432"
    volumes:
      - avtoslot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avtoslot -d avtoslot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  avtoslot_postgres_data:
